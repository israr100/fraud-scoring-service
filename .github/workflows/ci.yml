name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check src tests
      - name: Train a model artifact (needed by API tests)
        run: python -m src.train
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Train artifact for the image
        run: |
          pip install -r requirements.txt
          python -m src.train
      - name: Build image
        run: docker build -f docker/Dockerfile -t fraud-scoring-service:ci .
